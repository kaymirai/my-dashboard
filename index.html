<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock Business Dashboard</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

        :root { --bg: #000; --panel: #111; --accent: #4285f4; --text: #fff; }
        
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 20px; height: 100vh; 
            display: grid; grid-template-columns: 4fr 3fr 3fr; gap: 20px; 
            box-sizing: border-box; overflow: hidden; 
        }

        .card { background: var(--panel); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #222; }
        
        /* パタパタ時計（フリップクロック）のスタイル */
        .flip-clock { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
        .flip-unit { position: relative; width: 140px; height: 180px; background: #222; border-radius: 8px; font-size: 10rem; text-align: center; line-height: 180px; font-weight: 900; }
        .flip-unit::before { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(0,0,0,0.5); z-index: 10; }
        .colon { font-size: 5rem; font-weight: 900; color: var(--accent); animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* めくれるアニメーションの簡易再現（CSSクラス切替用） */
        .flip-animate { animation: flipDown 0.6s ease-in; }
        @keyframes flipDown { 
            0% { transform: rotateX(0); }
            100% { transform: rotateX(-20deg); opacity: 0.8; }
        }

        #date { font-size: 2rem; color: var(--accent); font-weight: 900; letter-spacing: 2px; }

        .sync-height { height: 420px; }
        .todo-table { width: 100%; border-collapse: collapse; }
        .todo-table td { padding: 12px 5px; border-bottom: 1px solid #222; font-size: 0.95rem; }
        .todo-time { color: var(--accent); font-weight: 900; width: 70px; }

        .weather-panel { background: linear-gradient(180deg, #111, #0a192f); text-align: center; }
        .weather-main { font-size: 4rem; margin: 10px 0; display: block; }

        #auth-btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; position: absolute; top: 20px; right: 20px; z-index: 1000; }
        h3 { margin: 0 0 10px 0; font-size: 1rem; border-left: 4px solid var(--accent); padding-left: 10px; }
    </style>
</head>
<body>

<button id="auth-btn" onclick="handleAuthClick()">GOOGLE LOGIN</button>

<div style="display: flex; flex-direction: column; gap: 20px;">
    <div style="grid-column: 1/3;">
        <div id="date">LOADING...</div>
        <div class="flip-clock">
            <div class="flip-unit" id="hour-tens">0</div>
            <div class="flip-unit" id="hour-ones">0</div>
            <div class="colon">:</div>
            <div class="flip-unit" id="min-tens">0</div>
            <div class="flip-unit" id="min-ones">0</div>
        </div>
    </div>
    <div class="card calendar-container sync-height"><div id="calendar"></div></div>
    <div class="card" style="flex-grow: 1; overflow-y: auto;">
        <h3>TODAY'S SCHEDULE</h3>
        <div id="today-event-list"></div>
    </div>
</div>

<div style="display: flex; flex-direction: column; gap: 20px;">
    <div class="card sync-height" style="margin-top: auto;">
        <h3>TO-DO LIST</h3>
        <div style="overflow-y: auto;">
            <table class="todo-table">
                <tbody id="todo-body"></tbody>
            </table>
        </div>
    </div>
    <div class="card" style="flex-grow:1; background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500') center/cover; opacity: 0.3;"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 20px;">
    <div class="card" id="news-card" style="height: 180px; justify-content: center; cursor: pointer;">
        <div style="font-size: 0.7rem; color: var(--accent);" id="news-source">NEWS</div>
        <div id="news-title" style="font-size: 1.2rem; font-weight: bold;">Loading...</div>
    </div>
    <div class="card weather-panel">
        <h3 id="location-name">WEATHER</h3>
        <span id="weather-icon" class="weather-main">--</span>
        <div id="weather-temp" style="font-size: 2.5rem; font-weight: 900;">--°C</div>
        <div id="hourly-forecast" style="display: flex; justify-content: space-around; margin-top: 20px;"></div>
    </div>
    <div class="card" style="height: 100px; display: flex; flex-direction: row; justify-content: space-around; align-items: center; font-weight: 900;">
        <div>NIKKEI <span style="color:#4ade80; display:block;">¥39,450</span></div>
        <div>USD/JPY <span style="color:#4ade80; display:block;">149.12</span></div>
    </div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
    const CLIENT_ID = '617076249682-lepri9n545siusvvnrf0cr538s9o5o07.apps.googleusercontent.com';
    const SCOPES = "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks.readonly";
    let tokenClient, calendar;

    function updateFlipUnit(id, value) {
        const el = document.getElementById(id);
        if (el.innerText !== value) {
            el.innerText = value;
            el.classList.remove('flip-animate');
            void el.offsetWidth; // reflow
            el.classList.add('flip-animate');
        }
    }

    function updateTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        
        updateFlipUnit('hour-tens', h[0]);
        updateFlipUnit('hour-ones', h[1]);
        updateFlipUnit('min-tens', m[0]);
        updateFlipUnit('min-ones', m[1]);

        document.getElementById('date').innerText = now.toLocaleDateString('ja-JP', {year:'numeric', month:'2-digit', day:'2-digit', weekday:'short'}).toUpperCase();
    }

    document.addEventListener('DOMContentLoaded', () => {
        calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth', locale: 'ja', height: '100%',
            dayCellContent: (e) => e.dayNumberText.replace('日', ''),
            eventClick: () => window.open('https://calendar.google.com/', '_blank')
        });
        calendar.render();
        updateTime();
        setInterval(updateTime, 1000);
        fetchNews();
        initWeather();
    });

    function gapiLoaded() { gapi.load('client', () => gapi.client.init({discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest", "https://www.googleapis.com/discovery/v1/apis/tasks/v1/rest"]})); }
    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID, scope: SCOPES,
            callback: (resp) => { localStorage.setItem('g_token', resp.access_token); loadData(); }
        });
        const savedToken = localStorage.getItem('g_token');
        if (savedToken) { gapi.client.setToken({access_token: savedToken}); loadData(); }
    }
    function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }

    async function loadData() {
        document.getElementById('auth-btn').style.display = 'none';
        const calRes = await gapi.client.calendar.events.list({calendarId: 'primary', timeMin: new Date().toISOString(), singleEvents: true, maxResults: 50});
        calendar.removeAllEvents();
        calendar.addEventSource(calRes.result.items.map(e => ({ title: e.summary, start: e.start.dateTime || e.start.date })));

        const todayStr = new Date().toISOString().split('T')[0];
        const todayEvents = calRes.result.items.filter(e => (e.start.dateTime || e.start.date).startsWith(todayStr));
        document.getElementById('today-event-list').innerHTML = todayEvents.map(e => `<div style="padding:5px; border-left:3px solid #4285f4; margin-bottom:5px; background:#1a1a1a; font-size:0.8rem;"><b>${e.start.dateTime ? e.start.dateTime.slice(11,16) : 'ALL DAY'}</b> ${e.summary}</div>`).join('') || "NO EVENTS";

        const taskListRes = await gapi.client.tasks.tasklists.list();
        if (taskListRes.result.items) {
            const tasks = await gapi.client.tasks.tasks.list({tasklist: taskListRes.result.items[0].id});
            document.getElementById('todo-body').innerHTML = (tasks.result.items || []).filter(t => t.status !== 'completed').map(t => `<tr><td class="todo-time">${t.updated ? t.updated.slice(11,16) : '--:--'}</td><td>${t.title}</td></tr>`).join('');
        }
    }

    async function initWeather() {
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&hourly=temperature_2m,weathercode&current_weather=true&timezone=Asia%2FTokyo`);
            const data = await res.json();
            const icons = { 0: "☀️", 1: "☀️", 2: "☁️", 3: "☁️", 61: "☔️", 63: "☔️" };
            document.getElementById('weather-icon').innerText = icons[data.current_weather.weathercode] || "☁️";
            document.getElementById('weather-temp').innerText = Math.round(data.current_weather.temperature) + "°C";
        });
    }

    async function fetchNews() {
        const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=https://rss.itmedia.co.jp/rss/2.0/aiplus.xml");
        const data = await res.json();
        let idx = 0;
        setInterval(() => {
            document.getElementById('news-title').innerText = data.items[idx].title;
            document.getElementById('news-source').innerText = "SOURCE: ITmedia AI+";
            idx = (idx + 1) % data.items.length;
        }, 10000);
    }
</script>
</body>
</html>
