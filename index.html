<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimalist Pro Fixed Dashboard v2</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
    :root { --bg: #000000; --panel: #111111; --text: #ffffff; --sub: #888888; --accent: #3b82f6; --border: #222222; }
    * { box-sizing: border-box; }
    
    body {
      margin: 0; padding: 20px; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      display: grid;
      grid-template-columns: 38% 31% 31%;
      gap: 20px;
    }

    /* カード共通: min-height: 0 が重要（これがないと中身が多い時に親を突き破る） */
    .card { 
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; 
      padding: 18px; display: flex; flex-direction: column; 
      min-height: 0; overflow: hidden; position: relative;
    }

    /* --- 左：カレンダー --- */
    .col-left { display: flex; flex-direction: column; gap: 20px; overflow: hidden; height: 100%; }
    .clock-area { flex: 0 0 auto; padding: 5px 0; }
    #date-display { font-size: 1.4rem; font-weight: 900; color: var(--accent); margin-bottom: 0px; }
    .digital-clock {
      font-size: clamp(3rem, 7vw, 6.5rem); /* 少しサイズ調整 */
      font-weight: 900; line-height: 1.0; 
      font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -3px;
    }
    
    /* カレンダーカード: 確実に残りの高さを埋める */
    #calendar-card { 
      flex: 1; /* 余った高さを全て使う */
      padding: 12px; /* カレンダー領域を広げるためパディングを少し減らす */
    }
    /* FullCalendar本体のコンテナ */
    #calendar {
      width: 100%;
      height: 100%; /* 親の高さに追従 */
      flex-grow: 1;
    }

    /* --- 中央：スケジュール & TODO --- */
    .col-center { display: flex; flex-direction: column; gap: 20px; overflow: hidden; height: 100%; }
    
    /* スケジュール: 内容に応じて伸びるが、画面の45%以上は取らない */
    .schedule-card { 
      flex: 0 1 auto; /* 必要分だけ伸びる */
      max-height: 45%; 
      min-height: 120px; /* 最低限の高さを保証 */
    }
    
    /* TODO: 残りの高さを全て埋める */
    .todo-card { 
      flex: 1 1 0; /* 100% - スケジュール分 を埋める */
      min-height: 0; /* 縮小を許可 */
    }

    h3 { margin: 0 0 12px 0; font-size: .75rem; letter-spacing: .15em; font-weight: 900; color: var(--sub); text-transform: uppercase; border-left: 4px solid var(--sub); padding-left: 10px; flex-shrink: 0; }
    
    /* スクロールエリアの重要設定 */
    .scroll-area { 
      flex-grow: 1; 
      overflow-y: auto; 
      padding-right: 5px; 
      min-height: 0; /* Flexアイテム内でのスクロールに必須 */
    }
    
    .item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 1rem; align-items: flex-start; font-weight: 700; line-height: 1.4; }
    .item-time { color: var(--accent); min-width: 50px; font-weight: 900; white-space: nowrap; }
    .todo-check { width: 20px; height: 20px; border: 2px solid var(--sub); border-radius: 4px; cursor: pointer; flex-shrink: 0; margin-top: 2px; }
    .todo-check:hover { border-color: var(--accent); }

    /* --- 右：ニュース --- */
    .col-right { display: flex; flex-direction: column; gap: 20px; overflow: hidden; height: 100%; }
    .news-card { flex: 0 0 auto; height: 150px; cursor: pointer; } /* 高さを固定 */
    .news-title { font-size: 1rem; font-weight: 900; line-height: 1.5; color: #fff; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .weather-card { flex: 1; min-height: 0; justify-content: center; } /* 天気は余白を埋める形に変更 */
    #weather-main { display: flex; align-items: center; justify-content: space-around; margin-bottom: 10px; }
    #weather-temp { font-size: 3rem; font-weight: 900; color: #fff; }
    #weather-icon { font-size: 3.5rem; }
    #hourly-forecast { display: flex; justify-content: space-around; border-top: 1px solid var(--border); padding-top: 15px; font-size: 0.9rem; color: #fff; font-weight: 900; }
    
    .market-card { flex: 0 0 80px; display: flex; flex-direction: row; justify-content: space-around; align-items: center; border-color: #333; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px;}

    #auth-btn { background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 900; cursor: pointer; font-size: 0.7rem; letter-spacing: 0.5px; transition: background 0.2s; }
    #auth-btn:hover { background: var(--accent); }

    /* スクロールバー装飾 */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    
    /* FullCalendar Overrides */
    .fc { font-family: 'Inter', sans-serif; --fc-border-color: #222; --fc-today-bg-color: rgba(59,130,246,0.1); }
    .fc-toolbar-title { font-size: 1.2rem !important; font-weight: 900; letter-spacing: -1px; }
    .fc-col-header-cell-cushion { color: var(--sub); font-size: 0.8rem; text-decoration: none !
