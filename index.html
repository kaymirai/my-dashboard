<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Dashboard</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        :root { --bg: #000; --panel: #111; --accent: #4285f4; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; height: 100vh; display: grid; grid-template-columns: 4fr 3fr 3fr; gap: 20px; box-sizing: border-box; overflow: hidden; }
        .card { background: var(--panel); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 時計とカレンダー */
        #clock { font-size: 8rem; font-weight: bold; line-height: 1; }
        #date { font-size: 1.5rem; color: var(--accent); margin-bottom: 10px; }
        .calendar-container { flex-grow: 1; min-height: 0; }
        
        /* To-Doリストのスクロール改善 */
        .todo-container { flex-grow: 1; overflow-y: auto; margin-top: 10px; padding-right: 5px; }
        .todo-item { padding: 12px; border-bottom: 1px solid #333; display: flex; align-items: center; cursor: pointer; }
        .todo-item:hover { background: #222; }
        
        /* ニュース */
        #news-title { font-size: 1.4rem; font-weight: bold; line-height: 1.4; }
        
        /* 天気 */
        .weather-info { display: flex; justify-content: space-around; margin-top: 10px; font-size: 0.9rem; }

        button#auth-btn { background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div style="display: flex; flex-direction: column; gap: 20px;">
    <div class="card" style="background:none; padding:0;">
        <div id="date"></div>
        <div id="clock">00:00</div>
    </div>
    <div class="card calendar-container">
        <div id="calendar"></div>
    </div>
    <div class="card" style="height: 100px;">
        <div id="location">位置情報取得中...</div>
        <div class="weather-info" id="weather"></div>
    </div>
</div>

<div class="card">
    <h3>Google To-Do</h3>
    <button id="auth-btn" onclick="handleAuthClick()">Googleにログイン</button>
    <div class="todo-container" id="todo-list"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 20px;">
    <div class="card" id="news-card" style="height: 200px; justify-content: center; cursor: pointer;">
        <div id="news-title">News Loading...</div>
    </div>
    <div class="card" style="flex-grow: 1; padding:0;">
        <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=800" style="width:100%; height:100%; object-fit:cover; opacity:0.7;">
    </div>
    <div class="card" style="height: 120px;">
        <div style="display: flex; justify-content: space-between;">
            <span>日経平均: ¥39,450</span>
            <span>USD/JPY: 149.12</span>
        </div>
    </div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
    const CLIENT_ID = '617076249682-lepri9n545siusvvnrf0cr538s9o5o07.apps.googleusercontent.com';
    const SCOPES = "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks.readonly";
    
    let tokenClient, calendar;

    // 1. カレンダー初期化
    document.addEventListener('DOMContentLoaded', () => {
        calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'ja',
            height: '100%',
            eventClick: (info) => { window.open('https://calendar.google.com/', '_blank'); }
        });
        calendar.render();
        updateTime();
        setInterval(updateTime, 1000);
    });

    function updateTime() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('date').innerText = now.toLocaleDateString('ja-JP', {year:'numeric', month:'2-digit', day:'2-digit', weekday:'short'});
    }

    // 2. Google Auth & 自動ログイン処理
    function gapiLoaded() { gapi.load('client', () => gapi.client.init({discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest", "https://www.googleapis.com/discovery/v1/apis/tasks/v1/rest"]})); }
    
    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID, scope: SCOPES,
            callback: (resp) => {
                localStorage.setItem('g_token', resp.access_token);
                loadData();
            }
        });
        // 保存されたトークンがあれば自動ロード
        const savedToken = localStorage.getItem('g_token');
        if (savedToken) {
            gapi.client.setToken({access_token: savedToken});
            loadData();
        }
    }

    function handleAuthClick() {
        tokenClient.requestAccessToken({prompt: 'consent'});
    }

    async function loadData() {
        document.getElementById('auth-btn').classList.add('hidden');
        
        // カレンダー予定取得
        const calRes = await gapi.client.calendar.events.list({calendarId: 'primary', timeMin: new Date().toISOString(), showDeleted: false, singleEvents: true, maxResults: 20, orderBy: 'startTime'});
        const events = calRes.result.items.map(e => ({ title: e.summary, start: e.start.dateTime || e.start.date }));
        calendar.removeAllEvents();
        calendar.addEventSource(events);

        // TODO取得
        const taskListRes = await gapi.client.tasks.tasklists.list();
        if (taskListRes.result.items) {
            const tasks = await gapi.client.tasks.tasks.list({tasklist: taskListRes.result.items[0].id});
            const listHtml = (tasks.result.items || []).filter(t => t.status !== 'completed').map(t => `<div class="todo-item" onclick="window.open('https://tasks.google.com/')">○ ${t.title}</div>`).join('');
            document.getElementById('todo-list').innerHTML = listHtml;
        }
    }

    // 3. 天気取得 (位置情報)
    navigator.geolocation.getCurrentPosition(async (pos) => {
        const {latitude, longitude} = pos.coords;
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m&timezone=Asia%2FTokyo`);
        const data = await res.json();
        document.getElementById('location').innerText = "現在の地域の天気";
        let html = "";
        for(let i=0; i<5; i++) {
            html += `<div>${new Date().getHours()+i}時<br><b>${Math.round(data.hourly.temperature_2m[i])}°</b></div>`;
        }
        document.getElementById('weather').innerHTML = html;
    });

    // 4. ニュース
    async function fetchNews() {
        const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=https://rss.itmedia.co.jp/rss/2.0/aiplus.xml");
        const data = await res.json();
        let idx = 0;
        const updateNews = () => {
            const item = data.items[idx];
            document.getElementById('news-title').innerText = item.title;
            document.getElementById('news-card').onclick = () => window.open(item.link, '_blank');
            idx = (idx + 1) % data.items.length;
        };
        updateNews();
        setInterval(updateNews, 10000);
    }
    fetchNews();
</script>
</body>
</html>
