<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airport Minimal Pro v3</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
    :root { --bg: #0b0f14; --panel: #111827; --text: #e5e7eb; --sub: #6b7280; --accent: #3b82f6; --border: rgba(255,255,255,.06); }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; display: grid; grid-template-columns: 4fr 3.2fr 2.8fr; gap: 20px;
    }

    #auth-btn { background: #fff; color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 900; cursor: pointer; font-size: 0.7rem; }

    .sync-container { display: flex; flex-direction: column; height: 100%; gap: 20px; min-height: 0; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; min-height: 0; }

    /* --- 空港ソラリー式パタパタ時計 --- */
    .clock-container { display: flex; gap: 12px; align-items: center; margin-bottom: 5px; }
    .flip-card { 
      position: relative; width: 130px; height: 160px; background: #0b1220; border-radius: 12px; 
      font-size: 10rem; line-height: 160px; text-align: center; font-weight: 900; 
      border: 1px solid rgba(255,255,255,.08); perspective: 1000px;
    }
    .flip-card::after { 
      content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; 
      background: rgba(0,0,0,0.8); z-index: 10; transform: translateY(-50%);
    }
    .colon { font-size: 4rem; font-weight: 900; color: var(--sub); padding-bottom: 10px; }

    .flap-move { animation: flap-down 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: top; }
    @keyframes flap-down { 
      0% { transform: rotateX(90deg); opacity: 0; } 
      100% { transform: rotateX(0deg); opacity: 1; } 
    }

    h3 { margin: 0 0 10px 0; font-size: .7rem; letter-spacing: .15em; font-weight: 900; color: var(--sub); text-transform: uppercase; }
    .scroll-area { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
    .item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; align-items: flex-start; }
    .item-time { font-weight: 900; color: var(--accent); min-width: 50px; }
    .todo-check { width: 18px; height: 18px; border: 2px solid var(--sub); border-radius: 4px; cursor: pointer; flex-shrink: 0; margin-top: 2px; }

    .news-card { height: 160px; cursor: pointer; }
    .news-title { font-size: 0.95rem; font-weight: 900; line-height: 1.5; margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    
    .weather-slim { height: 75px; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 20px; }
    #weather-temp { font-size: 2rem; font-weight: 900; }
    #weather-icon { font-size: 2.2rem; }

    .kpi-box { height: 80px; flex-direction: row; justify-content: space-around; align-items: center; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  </style>
</head>
<body>

<div class="sync-container">
  <div>
    <div id="date" style="font-size: 1.35rem; font-weight: 900; color: var(--accent); margin-bottom: 5px;">0000.00.00</div>
    <div class="clock-container">
      <div class="flip-card" id="h1">0</div><div class="flip-card" id="h2">0</div>
      <div class="colon">:</div>
      <div class="flip-card" id="m1">0</div><div class="flip-card" id="m2">0</div>
    </div>
  </div>
  <div class="card" style="flex:1;"><div id="calendar"></div></div>
</div>

<div class="sync-container">
  <div class="card" style="height: 38%;">
    <h3>TODAY'S SCHEDULE</h3>
    <div class="scroll-area" id="today-events"><div style="color:var(--sub)">同期中...</div></div>
  </div>
  <div class="card" style="flex-grow: 1;">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
      <h3>GOOGLE TO-DO</h3>
      <button id="auth-btn" onclick="handleAuthClick()">LOGIN</button>
    </div>
    <div class="scroll-area" id="todo-list"></div>
  </div>
</div>

<div class="sync-container">
  <div class="card news-card" id="news-tech">
    <h3 id="tech-source">TECH NEWS</h3>
    <div class="news-title" id="tech-title">Loading...</div>
  </div>
  <div class="card news-card" id="news-trend">
    <h3 id="trend-source">TRENDS / GENERAL</h3>
    <div class="news-title" id="trend-title">Loading...</div>
  </div>
  <div class="card weather-slim">
    <div style="display:flex; align-items:center; gap:10px;"><span id="weather-icon">--</span><span id="weather-temp">--°</span></div>
    <div id="hourly-forecast" style="display:flex; gap:12px; font-size:0.7rem; color:var(--sub); font-weight:700;"></div>
  </div>
  <div class="card kpi-box">
    <div style="text-align:center;"><h3>NIKKEI</h3><b style="font-size:1.2rem;">39,450</b></div>
    <div style="text-align:center;"><h3>USD/JPY</h3><b style="font-size:1.2rem;">149.12</b></div>
  </div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
  const CLIENT_ID = '617076249682-lepri9n545siusvvnrf0cr538s9o5o07.apps.googleusercontent.com';
  const SCOPES = "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks"; 
  let tokenClient, cal, currentTaskListId;

  function updateFlip(id, val) {
    const el = document.getElementById(id);
    if (el.innerText !== val) {
      el.innerText = val;
      el.classList.remove('flap-move');
      void el.offsetWidth;
      el.classList.add('flap-move');
    }
  }

  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    updateFlip('h1', h[0]); updateFlip('h2', h[1]);
    updateFlip('m1', m[0]); updateFlip('m2', m[1]);
    document.getElementById('date').innerText = now.toLocaleDateString('ja-JP', {year:'numeric', month:'2-digit', day:'2-digit', weekday:'short'}).toUpperCase();
  }

  function gapiLoaded() { gapi.load('client', async () => { await gapi.client.init({ discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest", "https://www.googleapis.com/discovery/v1/apis/tasks/v1/rest"] }); }); }
  function gisLoaded() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: (resp) => { if (resp.access_token) { localStorage.setItem('g_token', resp.access_token); loadData(); } }
    });
    const saved = localStorage.getItem('g_token');
    if (saved) { gapi.client.setToken({access_token: saved}); loadData(); }
  }
  function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }

  async function loadData() {
    document.getElementById('auth-btn').style.display = 'none';
    const res = await gapi.client.calendar.events.list({ calendarId: 'primary', timeMin: new Date().toISOString(), singleEvents: true, orderBy: 'startTime' });
    const events = res.result.items.map(e => ({ title: e.summary, start: e.start.dateTime || e.start.date }));
    cal.removeAllEvents(); cal.addEventSource(events);
    
    const todayJST = new Date().toLocaleDateString('en-CA'); 
    const todayEvents = events.filter(e => e.start.startsWith(todayJST));
    document.getElementById('today-events').innerHTML = todayEvents.map(e => `
      <div class="item"><div class="item-time">${e.start.includes('T') ? e.start.slice(11,16) : 'ALL'}</div><div>${e.title}</div></div>
    `).join('') || '<div style="color:var(--sub)">予定なし</div>';

    const taskListRes = await gapi.client.tasks.tasklists.list();
    if (taskListRes.result.items) {
      currentTaskListId = taskListRes.result.items[0].id;
      const tasks = await gapi.client.tasks.tasks.list({ tasklist: currentTaskListId, showCompleted: false });
      document.getElementById('todo-list').innerHTML = (tasks.result.items || []).map(t => `
        <div class="item">
          <div class="todo-check" onclick="completeTask('${t.id}')"></div>
          <div class="todo-text">${t.title}</div>
        </div>
      `).join('');
    }
  }

  async function completeTask(taskId) {
    await gapi.client.tasks.tasks.patch({ tasklist: currentTaskListId, task: taskId, resource: { status: 'completed' } });
    loadData(); 
  }

  async function initNews() {
    const techFeeds = [
      { name: "YAHOO IT", url: "https://news.yahoo.co.jp/rss/topics/it.xml" },
      { name: "ねとらぼ", url: "https://news.yahoo.co.jp/rss/media/it_nlab/all.xml" }
    ];
    const trendFeeds = [
      { name: "GOOGLE TRENDS", url: "https://trends.google.co.jp/trends/trendingsearches/daily/rss?geo=JP" },
      { name: "YAHOO 総合", url: "https://news.yahoo.co.jp/rss/topics/top-picks.xml" }
    ];

    const setupCycle = async (feeds, titleId, sourceId, containerId) => {
      let allItems = [];
      for (let f of feeds) {
        try {
          const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f.url)}`);
          const data = await res.json();
          data.items.forEach(i => allItems.push({ title: i.title, link: i.link, source: f.name }));
        } catch(e) {}
      }
      let idx = 0;
      const rotate = () => {
        if(!allItems.length) return;
        const item = allItems[idx];
        document.getElementById(titleId).innerText = item.title;
        document.getElementById(sourceId).innerText = `SOURCE: ${item.source}`;
        document.getElementById(containerId).onclick = () => window.open(item.link, '_blank');
        idx = (idx + 1) % allItems.length;
      };
      rotate(); setInterval(rotate, 10000);
    };

    setupCycle(techFeeds, 'tech-title', 'tech-source', 'news-tech');
    setupCycle(trendFeeds, 'trend-title', 'trend-source', 'news-trend');
  }

  async function initWeather() {
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&hourly=temperature_2m,weathercode&current_weather=true&timezone=Asia%2FTokyo`);
      const data = await res.json();
      const icons = { 0:"☀️", 1:"🌤", 2:"☁️", 3:"☁️", 61:"☔️" };
      document.getElementById('weather-icon').innerText = icons[data.current_weather.weathercode] || "☁️";
      document.getElementById('weather-temp').innerText = Math.round(data.current_weather.temperature);
      let html = "";
      for(let i=3; i<=9; i+=3) {
        html += `<div>${data.hourly.time[i].slice(11,16)} ${icons[data.hourly.weathercode[i]]||"☁️"}${Math.round(data.hourly.temperature_2m[i])}°</div>`;
      }
      document.getElementById('hourly-forecast').innerHTML = html;
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
      initialView: 'dayGridMonth', locale: 'ja', height: '100%',
      headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
      dayCellContent: (e) => e.dayNumberText.replace('日', '')
    });
    cal.render();
    tick(); setInterval(tick, 1000);
    initNews(); initWeather();
  });
</script>
</body>
</html>
