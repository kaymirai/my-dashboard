<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimalist Flip Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');

/* ========= Color System ========= */
:root{
  --bg:#0b0f14;
  --panel:#111827;
  --panel2:#0f1623;
  --text:#e5e7eb;
  --sub:#9ca3af;
  --border:rgba(255,255,255,.06);
  --accent:#3b82f6;
}

/* ========= Base ========= */
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  display:grid;
  grid-template-columns:4fr 3fr 3fr;
  gap:20px;
  overflow:hidden;
}

/* ========= Card ========= */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 60%),var(--panel);
  border-radius:14px;
  border:1px solid var(--border);
  padding:18px;
  display:flex;
  flex-direction:column;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}

/* ========= Left Header (Date) ========= */
.date-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.date-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
}
#date{
  font-size:1.35rem;
  font-weight:900;
}
#date-sub{
  font-size:.8rem;
  color:var(--sub);
  letter-spacing:.15em;
}

/* ========= Flip Clock ========= */
.flip-clock{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.flip-unit{
  width:92px;height:128px;
  background:#0b1220;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  font-size:8.2rem;
  font-weight:900;
  text-align:center;
  line-height:128px;
}

.leaf{animation:flip .55s ease}
@keyframes flip{
  0%{transform:rotateX(0)}
  50%{transform:rotateX(-90deg);opacity:.5}
  100%{transform:rotateX(0)}
}

.colon{
  font-size:3.8rem;
  opacity:.6;
  padding-bottom:6px;
}

/* 秒は「添え物」 */
#s1,#s2{
  width:64px;height:92px;
  line-height:92px;
  font-size:5.4rem;
  opacity:.85;
}
.flip-clock .colon:last-of-type{
  opacity:.45;
  transform:translateY(2px);
}

/* ========= Layout ========= */
.sync-container{
  display:flex;
  flex-direction:column;
  height:100%;
  min-height:0;
}

/* ========= Calendar ========= */
#calendar{height:100%}
.fc-theme-standard td,
.fc-theme-standard th{
  border:1px solid var(--border)!important;
}
.fc-daygrid-day-number{
  color:var(--sub)!important;
  font-weight:700;
}

/* ========= Headings ========= */
h3{
  margin:0;
  font-size:.75rem;
  color:var(--sub);
  letter-spacing:.15em;
  font-weight:900;
}

/* ========= Todo ========= */
.todo-list{
  margin-top:12px;
  overflow-y:auto;
}
.todo-item{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.todo-item::before{
  content:"";
  width:8px;height:8px;
  background:var(--sub);
  border-radius:3px;
  margin-top:6px;
}

/* ========= Button ========= */
#auth-btn{
  background:rgba(255,255,255,.06);
  color:var(--text);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:10px;
  font-size:.7rem;
  font-weight:900;
  letter-spacing:.1em;
  cursor:pointer;
}

/* ========= Right Column (Quiet) ========= */
.sync-container:last-child .card{
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 60%),var(--panel2);
  border-color:rgba(255,255,255,.05);
}

/* Weather */
#weather-icon{font-size:4rem;opacity:.9}
#weather-temp{font-size:2.8rem;font-weight:900}

/* KPI */
.mini-kpi{
  flex-direction:row;
  justify-content:space-around;
  align-items:center;
}
.mini-kpi b{font-size:1.25rem}
.mini-kpi .label{
  font-size:.7rem;
  color:var(--sub);
  letter-spacing:.15em;
}

/* Scrollbar */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.12);
  border-radius:999px;
}
</style>
</head>

<body>

<!-- LEFT -->
<div class="sync-container">
  <div class="date-header">
    <span class="date-dot"></span>
    <div id="date">0000/00/00（日）</div>
    <div id="date-sub">今日</div>
  </div>

  <div class="flip-clock">
    <div class="flip-unit" id="h1">0</div>
    <div class="flip-unit" id="h2">0</div>
    <div class="colon">:</div>
    <div class="flip-unit" id="m1">0</div>
    <div class="flip-unit" id="m2">0</div>
    <div class="colon">:</div>
    <div class="flip-unit" id="s1">0</div>
    <div class="flip-unit" id="s2">0</div>
  </div>

  <div class="card" style="flex-grow:1">
    <div id="calendar"></div>
  </div>
</div>

<!-- CENTER -->
<div class="sync-container" style="padding-top:44px">
  <div class="card" style="flex-grow:1">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>やること</h3>
      <button id="auth-btn">ログイン</button>
    </div>
    <div class="todo-list">
      <div class="todo-item">ショート動画 3本</div>
      <div class="todo-item">MV制作</div>
      <div class="todo-item">Etsyデザイン</div>
    </div>
  </div>
</div>

<!-- RIGHT -->
<div class="sync-container">
  <div class="card" style="height:150px;justify-content:center">
    <h3>ニュース</h3>
    <div style="font-weight:900;margin-top:8px">読み込み中…</div>
  </div>

  <div class="card" style="flex-grow:1;align-items:center;justify-content:center;margin:20px 0">
    <h3>現在の天気</h3>
    <div id="weather-icon">☀️</div>
    <div id="weather-temp">3°C</div>
  </div>

  <div class="card mini-kpi" style="height:100px">
    <div>
      <div class="label">日経平均</div>
      <b>39,450</b>
    </div>
    <div>
      <div class="label">ドル円</div>
      <b>149.12</b>
    </div>
  </div>
</div>

<script>
function updateFlip(id,val){
  const el=document.getElementById(id)
  if(el.textContent!==val){
    el.textContent=val
    el.classList.remove('leaf')
    void el.offsetWidth
    el.classList.add('leaf')
  }
}

function formatDate(d){
  const w="日月火水木金土"[d.getDay()]
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}（${w}）`
}

function tick(){
  const d=new Date()
  const h=String(d.getHours()).padStart(2,'0')
  const m=String(d.getMinutes()).padStart(2,'0')
  const s=String(d.getSeconds()).padStart(2,'0')
  updateFlip('h1',h[0]);updateFlip('h2',h[1])
  updateFlip('m1',m[0]);updateFlip('m2',m[1])
  updateFlip('s1',s[0]);updateFlip('s2',s[1])
  document.getElementById('date').textContent=formatDate(d)
}

document.addEventListener('DOMContentLoaded',()=>{
  new FullCalendar.Calendar(calendar,{
    initialView:'dayGridMonth',
    locale:'ja',
    height:'100%'
  }).render()
  tick()
  setInterval(tick,1000)
})
</script>
</body>
</html>
