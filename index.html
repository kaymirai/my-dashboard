<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Digital Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
    
    :root {
      --bg: #050505;
      --panel: #121212;
      --text: #ffffff;
      --sub: #888888;
      --accent: #3b82f6;
      --border: #222222;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 25px; height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      display: grid;
      grid-template-columns: 4fr 3fr 3fr;
      gap: 25px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* --- デジタル時計エリア（電卓風・崩れない） --- */
    .time-header { margin-bottom: 10px; }
    #date-display { font-size: 1.6rem; font-weight: 900; color: var(--accent); letter-spacing: 1px; }
    
    .digital-clock {
      font-size: 11rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      font-variant-numeric: tabular-nums; /* 数字の幅を固定してガタつき防止 */
      display: flex;
      align-items: baseline;
    }
    .digital-clock span { color: var(--text); }
    .digital-clock .colon { color: var(--sub); margin: 0 5px; font-size: 8rem; vertical-align: middle; }

    /* --- スケジュール & ToDo --- */
    h3 { margin: 0 0 15px 0; font-size: 0.8rem; letter-spacing: 2px; font-weight: 900; color: var(--sub); text-transform: uppercase; border-left: 4px solid var(--accent); padding-left: 10px; }
    .scroll-area { flex-grow: 1; overflow-y: auto; padding-right: 8px; }
    
    .item { display: flex; gap: 15px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .item-time { font-weight: 900; color: var(--accent); min-width: 60px; font-size: 1rem; }
    .item-text { font-weight: 700; font-size: 1rem; line-height: 1.4; }
    
    .todo-check { width: 22px; height: 22px; border: 2px solid var(--sub); border-radius: 4px; cursor: pointer; flex-shrink: 0; margin-top: 2px; }

    /* --- ニュースエリア（安定重視） --- */
    .news-title { font-size: 1.2rem; font-weight: 900; line-height: 1.6; color: #fff; margin-top: 10px; }
    #news-source { font-size: 0.75rem; color: var(--accent); font-weight: 900; }

    /* --- 天気エリア（視認性重視） --- */
    .weather-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    #weather-temp { font-size: 3.5rem; font-weight: 900; }
    #weather-icon { font-size: 4rem; }
    .forecast-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
    .forecast-item { text-align: center; font-weight: 900; font-size: 1rem; color: #eee; }

    /* --- 共通：ログインボタン --- */
    #auth-btn { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 0.8rem; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

    #calendar { font-size: 0.9rem; }
    .fc-daygrid-day-number { color: #aaa !important; font-weight: 700; text-decoration: none !important; }
  </style>
</head>
<body>

<div style="display: flex; flex-direction: column; gap: 25px;">
  <div class="time-header">
    <div id="date-display">2026.01.04 SUN</div>
    <div class="digital-clock">
      <span id="h-display">00</span><span class="colon">:</span><span id="m-display">00</span>
    </div>
  </div>
  <div class="card" style="flex-grow: 1;"><div id="calendar"></div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 25px;">
  <div class="card" style="height: 40%;">
    <h3>TODAY'S SCHEDULE</h3>
    <div class="scroll-area" id="schedule-list">
      <div style="color:var(--sub); font-weight:700;">Login to sync your events</div>
    </div>
  </div>
  <div class="card" style="flex-grow: 1;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3>GOOGLE TO-DO</h3>
      <button id="auth-btn" onclick="handleAuthClick()">GOOGLE LOGIN</button>
    </div>
    <div class="scroll-area" id="todo-list"></div>
  </div>
</div>

<div style="display: flex; flex-direction: column; gap: 25px;">
  <div class="card" style="height: 220px; justify-content: center; cursor: pointer;" id="news-card">
    <div id="news-source">LOADING SOURCE...</div>
    <div class="news-title" id="news-title">Fetching the latest headlines...</div>
  </div>
  
  <div class="card" style="flex-grow: 1;">
    <h3>WEATHER</h3>
    <div class="weather-row">
      <div id="weather-temp">--°</div>
      <div id="weather-icon">--</div>
    </div>
    <div class="forecast-grid" id="forecast-area"></div>
  </div>

  <div class="card" style="height: 100px; flex-direction: row; justify-content: space-around; align-items: center;">
    <div style="text-align:center;"><h3>NIKKEI</h3><b style="font-size:1.4rem;">39,450</b></div>
    <div style="text-align:center;"><h3>USD/JPY</h3><b style="font-size:1.4rem;">149.12</b></div>
  </div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
  const CLIENT_ID = '617076249682-lepri9n545siusvvnrf0cr538s9o5o07.apps.googleusercontent.com';
  const SCOPES = "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks";
  let tokenClient, cal, currentTaskListId;

  // --- シンプル・安定した時計 ---
  function updateClock() {
    const now = new Date();
    document.getElementById('h-display').innerText = String(now.getHours()).padStart(2, '0');
    document.getElementById('m-display').innerText = String(now.getMinutes()).padStart(2, '0');
    
    const w = ["SUN","MON","TUE","WED","THU","FRI","SAT"][now.getDay()];
    document.getElementById('date-display').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${w}`;
  }

  // --- Google API ---
  function gapiLoaded() { gapi.load('client', async () => { await gapi.client.init({ discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest", "https://www.googleapis.com/discovery/v1/apis/tasks/v1/rest"] }); }); }
  function gisLoaded() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: (resp) => { if (resp.access_token) { localStorage.setItem('g_token', resp.access_token); loadData(); } }
    });
    const saved = localStorage.getItem('g_token');
    if (saved) { gapi.client.setToken({access_token: saved}); loadData(); }
  }
  function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }

  async function loadData() {
    document.getElementById('auth-btn').style.display = 'none';
    const res = await gapi.client.calendar.events.list({ calendarId: 'primary', timeMin: new Date().toISOString(), singleEvents: true, orderBy: 'startTime' });
    const events = res.result.items.map(e => ({ title: e.summary, start: e.start.dateTime || e.start.date }));
    cal.removeAllEvents(); cal.addEventSource(events);
    
    const todayStr = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
    const todayEvents = events.filter(e => e.start.startsWith(todayStr));
    document.getElementById('schedule-list').innerHTML = todayEvents.map(e => `
      <div class="item"><div class="item-time">${e.start.includes('T') ? e.start.slice(11,16) : 'ALL'}</div><div class="item-text">${e.title}</div></div>
    `).join('') || '<div style="color:var(--sub); font-weight:700;">No events today</div>';

    const taskListRes = await gapi.client.tasks.tasklists.list();
    if (taskListRes.result.items) {
      currentTaskListId = taskListRes.result.items[0].id;
      const tasks = await gapi.client.tasks.tasks.list({ tasklist: currentTaskListId, showCompleted: false });
      document.getElementById('todo-list').innerHTML = (tasks.result.items || []).map(t => `
        <div class="item">
          <div class="todo-check" onclick="completeTask('${t.id}')"></div>
          <div class="item-text">${t.title}</div>
        </div>
      `).join('');
    }
  }

  async function completeTask(taskId) {
    await gapi.client.tasks.tasks.patch({ tasklist: currentTaskListId, task: taskId, resource: { status: 'completed' } });
    loadData(); 
  }

  // --- Yahoo IT ニュース（安定版） ---
  async function initNews() {
    try {
      const rssUrl = "https://news.yahoo.co.jp/rss/topics/it.xml";
      const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&t=${Date.now()}`);
      const data = await res.json();
      if(!data.items) throw new Error();
      
      let idx = 0;
      const rotate = () => {
        const item = data.items[idx];
        document.getElementById('news-title').innerText = item.title;
        document.getElementById('news-source').innerText = "YAHOO! JAPAN IT NEWS";
        document.getElementById('news-card').onclick = () => window.open(item.link, '_blank');
        idx = (idx + 1) % data.items.length;
      };
      rotate(); setInterval(rotate, 15000);
    } catch(e) {
      document.getElementById('news-title').innerText = "Unable to load news. Check connection.";
    }
  }

  // --- 天気 ---
  async function initWeather() {
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&hourly=temperature_2m,weathercode&current_weather=true&timezone=Asia%2FTokyo`);
      const data = await res.json();
      const iconMap = { 0:"☀️", 1:"🌤", 2:"☁️", 3:"☁️", 61:"☔️" };
      document.getElementById('weather-icon').innerText = iconMap[data.current_weather.weathercode] || "☁️";
      document.getElementById('weather-temp').innerText = Math.round(data.current_weather.temperature) + "°";
      
      let html = "";
      for(let i=3; i<=9; i+=3) {
        html += `<div class="forecast-item">${data.hourly.time[i].slice(11,16)}<br>${iconMap[data.hourly.weathercode[i]]||"☁️"}<br>${Math.round(data.hourly.temperature_2m[i])}°</div>`;
      }
      document.getElementById('forecast-area').innerHTML = html;
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
      initialView: 'dayGridMonth', locale: 'ja', height: '100%',
      headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
      dayCellContent: (e) => e.dayNumberText.replace('日', '')
    });
    cal.render();
    updateClock(); setInterval(updateClock, 1000);
    initNews(); initWeather();
  });
</script>
</body>
</html>
