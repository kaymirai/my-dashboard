<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimalist Pro Fixed Dashboard v6</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
    
    :root {
      --c-base:   #000000;
      --c-panel:  #111111;
      --c-text:   #ffffff;
      --c-accent: #3b82f6;
      --c-sub:    rgba(255, 255, 255, 0.5); 
      --c-border: rgba(255, 255, 255, 0.15);
      
      --c-good:   #22c55e; /* 平常運転用 */
      --c-warn:   #ef4444; /* 遅延用 */

      --fz-lg: 1.8rem;
      --fz-md: 1.0rem;
      --fz-sm: 0.75rem;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0; padding: 20px; height: 100vh; overflow: hidden; 
      background: var(--c-base); color: var(--c-text);
      font-family: 'Inter', sans-serif;
      display: grid;
      grid-template-columns: 38% 31% 31%;
      gap: 20px;
    }

    .card { 
      background: var(--c-panel); border: 1px solid var(--c-border); 
      border-radius: 12px; padding: 18px; 
      display: flex; flex-direction: column; 
      min-height: 0; overflow: hidden; position: relative;
    }

    /* --- Column Left --- */
    .col-left { display: flex; flex-direction: column; gap: 20px; overflow: hidden; height: 100%; }
    .clock-area { flex: 0 0 auto; padding: 0 0 10px 0; }
    
    #date-display { 
      font-size: var(--fz-lg); font-weight: 900; color: var(--c-accent); 
      margin-bottom: -10px; letter-spacing: -1px; margin-left: 2px;
    }
    .digital-clock {
      font-size: clamp(4.5rem, 10.5vw, 10rem); font-weight: 900; line-height: 1.0; 
      font-variant-numeric: tabular-nums; white-space: nowrap; 
      letter-spacing: -6px; margin-left: -5px; color: var(--c-text);
    }
    #calendar-card { flex: 1; padding: 16px; }
    #calendar { width: 100%; height: 100%; }

    /* --- Column Center --- */
    .col-center { display: flex; flex-direction: column; gap: 20px; overflow: hidden; height: 100%; }
    .schedule-card { flex: 0 1 auto; max-height: 45%; min-height: 120px; }
    .todo-card { flex: 1 1 0; min-height: 0; }
    
    h3 { 
      margin: 0 0 12px 0; font-size: var(--fz-sm); letter-spacing: .15em; 
      font-weight: 900; color: var(--c-sub); text-transform: uppercase; 
      border-left: 4px solid var(--c-accent); padding-left: 10px; flex-shrink: 0; 
    }
    .scroll-area { flex-grow: 1; overflow-y: auto; padding-right: 5px; min-height: 0; }
    .item { 
      display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--c-border); 
      font-size: var(--fz-md); align-items: flex-start; font-weight: 700; line-height: 1.4; 
    }
    .item-time { color: var(--c-accent); min-width: 50px; font-size: var(--fz-sm); font-weight: 900; white-space: nowrap; margin-top: 2px; }
    .todo-check { 
      width: 18px; height: 18px; border: 2px solid var(--c-sub); border-radius: 4px; 
      cursor: pointer; flex-shrink: 0; margin-top: 3px; 
    }
    .todo-check:hover { border-color: var(--c-accent); }

    /* --- Column Right --- */
    .col-right { display: flex; flex-direction: column; gap: 20px; overflow: hidden; height: 100%; }
    
    .news-card { flex: 0 0 auto; height: 125px; cursor: pointer; } /* 少し高さを詰めた */
    .news-src { font-size: var(--fz-sm); color: var(--c-accent); font-weight: 900; }
    .news-title { 
      font-size: var(--fz-md); font-weight: 900; line-height: 1.5; color: var(--c-text); margin-top: 8px; 
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; 
    }
    
    /* Railway Card (New) */
    .railway-card { 
      flex: 0 0 auto; height: 100px; cursor: pointer; 
      display: flex; flex-direction: column; justify-content: center;
    }
    .rail-status-row { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
    .rail-line { font-size: var(--fz-lg); font-weight: 900; line-height: 1; }
    .rail-badge { 
      font-size: var(--fz-sm); font-weight: 900; padding: 4px 8px; 
      border-radius: 4px; background: #333; color: #fff; text-transform: uppercase;
    }
    
    .weather-card { flex: 1; min-height: 0; justify-content: center; }
    #weather-main { display: flex; align-items: center; justify-content: space-around; margin-bottom: 10px; }
    #weather-temp { font-size: 3.5rem; font-weight: 900; color: var(--c-text); line-height: 1; }
    #weather-icon { font-size: 3.5rem; }
    #hourly-forecast { 
      display: flex; justify-content: space-around; border-top: 1px solid var(--c-border); 
      padding-top: 15px; font-size: var(--fz-sm); color: var(--c-text); font-weight: 900; 
    }
    
    .market-card { 
      flex: 0 0 80px; display: flex; flex-direction: row; justify-content: space-around; align-items: center; 
      background: var(--c-panel); border: 1px solid var(--c-border); border-radius: 12px; padding: 10px;
    }
    .market-val { font-size: var(--fz-lg); font-weight: 900; display:block; line-height: 1; margin-top: -5px; }

    #auth-btn { 
      background: var(--c-panel); border: 1px solid var(--c-border); color: var(--c-text); 
      padding: 4px 10px; border-radius: 4px; font-weight: 900; cursor: pointer; 
      font-size: var(--fz-sm); transition: all 0.2s; 
    }
    #auth-btn:hover { border-color: var(--c-accent); color: var(--c-accent); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-panel); border: 1px solid var(--c-border); border-radius: 10px; }
    
    /* FullCalendar */
    .fc { font-family: 'Inter', sans-serif; --fc-border-color: var(--c-border); --fc-today-bg-color: rgba(59,130,246,0.15); }
    .fc-toolbar-title { 
      font-size: 1.4rem !important; font-weight: 900; letter-spacing: -0.5px; 
      color: var(--c-text); margin-left: 4px; 
    }
    .fc-col-header-cell-cushion { color: var(--c-sub); font-size: var(--fz-sm); text-decoration: none !important; py: 4px; }
    .fc-daygrid-day-number { color: var(--c-text) !important; font-weight: 700; text-decoration: none !important; font-size: 0.85rem; padding: 4px 8px !important; }
    .fc-day-today .fc-daygrid-day-number { color: var(--c-accent) !important; font-size: 1rem; }
    .fc-event { border: none; background: var(--c-accent); font-size: 0.7rem; font-weight: 700; padding: 1px 3px; border-radius: 2px; }
    .fc-day-other .fc-daygrid-day-number { opacity: 0.3; }
    .fc-view-harness { height: 100% !important; } 
    .fc-scroller { overflow: hidden !important; }
    .fc-toolbar.fc-header-toolbar { margin-bottom: 10px !important; }
  </style>
</head>
<body>

<div class="col-left">
  <div class="clock-area">
    <div id="date-display">--.-- ---</div>
    <div class="digital-clock"><span id="h">00</span><span style="color:var(--c-sub)">:</span><span id="m">00</span></div>
  </div>
  <div class="card" id="calendar-card">
    <div id="calendar"></div>
  </div>
</div>

<div class="col-center">
  <div class="card schedule-card">
    <h3>TODAY'S SCHEDULE</h3>
    <div class="scroll-area" id="today-events">
        <div style="color:var(--c-sub); font-size:var(--fz-sm);">Loading...</div>
    </div>
  </div>
  <div class="card todo-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-shrink: 0;">
      <h3>GOOGLE TO-DO</h3>
      <button id="auth-btn" onclick="handleAuthClick()">LOGIN</button>
    </div>
    <div class="scroll-area" id="todo-list">
        <div style="color:var(--c-sub); font-size:var(--fz-sm); padding-top:20px;">Login to sync tasks</div>
    </div>
  </div>
</div>

<div class="col-right">
  <div class="card news-card" id="news-tech">
    <div class="news-src" id="tech-src">TECH NEWS</div>
    <div class="news-title" id="tech-title">取得中...</div>
  </div>
  
  <div class="card railway-card" id="railway-card" onclick="window.open('https://transit.yahoo.co.jp/diainfo/109/0', '_blank')">
    <div class="news-src">ODAKYU LINE</div>
    <div class="rail-status-row">
        <div class="rail-line">小田急線</div>
        <div class="rail-badge" id="rail-status">CHECKING...</div>
    </div>
  </div>

  <div class="card weather-card">
    <div id="weather-main"><div id="weather-icon">--</div><div id="weather-temp">--°</div></div>
    <div id="hourly-forecast"></div>
  </div>
  <div class="market-card">
    <div style="text-align:center;"><h3>NIKKEI</h3><b class="market-val">39,450</b></div>
    <div style="text-align:center;"><h3>USD/JPY</h3><b class="market-val">149.12</b></div>
  </div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
  const CLIENT_ID = '617076249682-lepri9n545siusvvnrf0cr538s9o5o07.apps.googleusercontent.com';
  const SCOPES = "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks";
  let tokenClient, cal, currentTaskListId;

  function tick() {
    const now = new Date();
    document.getElementById('h').innerText = String(now.getHours()).padStart(2, '0');
    document.getElementById('m').innerText = String(now.getMinutes()).padStart(2, '0');
    const w = ["SUN","MON","TUE","WED","THU","FRI","SAT"][now.getDay()];
    document.getElementById('date-display').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${w}`;
  }

  /* --- Proxy Fetcher --- */
  const proxyServices = [
    (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`
  ];
  async function fetchWithRetry(url) {
    for (const getProxy of proxyServices) {
      try {
        const res = await fetch(getProxy(url));
        if (res.ok) return await res.text();
      } catch (e) {}
    }
    return null;
  }

  /* --- Railway Info (Scraping Yahoo) --- */
  async function initRailway() {
    const yahooUrl = 'https://transit.yahoo.co.jp/diainfo/109/0'; // 小田急小田原線
    const html = await fetchWithRetry(yahooUrl);
    const badge = document.getElementById('rail-status');
    const card = document.getElementById('railway-card');
    
    if (!html) {
        badge.innerText = "UNKNOWN";
        return;
    }

    // 簡易的な判定ロジック: "平常" という文字が含まれていればOK
    // Yahoo路線情報の構造に依存するため、将来的に動かなくなる可能性あり
    if (html.includes('平常運転') || html.includes('平常どおり')) {
        badge.innerText = "● NORMAL";
        badge.style.color = "var(--c-good)";
        badge.style.background = "rgba(34, 197, 94, 0.2)";
    } else if (html.includes('遅延') || html.includes('見合わせ') || html.includes('運休')) {
        badge.innerText = "● DELAY / INFO";
        badge.style.color = "var(--c-warn)";
        badge.style.background = "rgba(239, 68, 68, 0.2)";
    } else {
        badge.innerText = "INFO";
    }
  }

  /* --- News --- */
  async function initNews() {
    const techFeeds = [{ name: 'はてなIT', url: 'https://b.hatena.ne.jp/hotentry/it.rss' }];
    // ニュース取得ロジック（簡略化）
    const res = await fetchWithRetry(techFeeds[0].url);
    if(res) {
        const xml = new DOMParser().parseFromString(res, "text/xml");
        const item = xml.querySelector("item");
        if(item) {
            document.getElementById('tech-title').innerText = item.querySelector("title").textContent;
            document.getElementById('tech-src').innerText = "SOURCE: HATENA IT";
            document.getElementById('news-tech').onclick = () => window.open(item.querySelector("link").textContent, '_blank');
        }
    }
  }

  /* --- Weather --- */
  async function initWeather() {
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&hourly=temperature_2m,weathercode&current_weather=true&timezone=Asia%2FTokyo`);
      const d = await res.json();
      const icons = { 0:"☀️", 1:"🌤", 2:"☁️", 3:"☁️", 61:"☔️", 63:"☔️", 80:"☔️", 95:"⚡️" };
      document.getElementById('weather-icon').innerText = icons[d.current_weather.weathercode] || "☁️";
      document.getElementById('weather-temp').innerText = Math.round(d.current_weather.temperature) + "°";
      let h = "";
      for(let i=3; i<=9; i+=3) h += `<div style="text-align:center">${d.hourly.time[i].slice(11,16)}<br>${icons[d.hourly.weathercode[i]]||"☁️"}${Math.round(d.hourly.temperature_2m[i])}°</div>`;
      document.getElementById('hourly-forecast').innerHTML = h;
    });
  }

  /* --- Google API --- */
  function gapiLoaded() { gapi.load('client', async () => { await gapi.client.init({ discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest", "https://www.googleapis.com/discovery/v1/apis/tasks/v1/rest"] }); }); }
  function gisLoaded() {
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: (resp) => { if (resp.access_token) { localStorage.setItem('g_token', resp.access_token); loadData(); } } });
    const saved = localStorage.getItem('g_token');
    if (saved) { gapi.client.setToken({access_token: saved}); loadData(); }
  }
  function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }

  async function loadData() {
    document.getElementById('auth-btn').style.display = 'none';
    try {
      const res = await gapi.client.calendar.events.list({ calendarId: 'primary', timeMin: new Date().toISOString(), singleEvents: true, orderBy: 'startTime', maxResults: 50 });
      const events = res.result.items.map(e => ({ title: e.summary, start: e.start.dateTime || e.start.date }));
      cal.removeAllEvents(); cal.addEventSource(events);
      const todayStr = new Date().toLocaleDateString('en-CA');
      const todayEvents = events.filter(e => e.start.startsWith(todayStr));
      document.getElementById('today-events').innerHTML = todayEvents.map(e => {
        const time = e.start.includes('T') ? e.start.slice(11,16) : 'ALL';
        return `<div class="item"><div class="item-time">${time}</div><div>${e.title}</div></div>`;
      }).join('') || '<div style="color:var(--c-sub); font-size:var(--fz-sm); padding-top:10px;">No events today</div>';
    } catch(e) { if(e.status === 401) localStorage.removeItem('g_token'); }

    try {
      const taskListRes = await gapi.client.tasks.tasklists.list();
      if (taskListRes.result.items) {
        currentTaskListId = taskListRes.result.items[0].id;
        const tasks = await gapi.client.tasks.tasks.list({ tasklist: currentTaskListId, showCompleted: false });
        document.getElementById('todo-list').innerHTML = (tasks.result.items || []).map(t => `<div class="item"><div class="todo-check" onclick="completeTask('${t.id}')"></div><div>${t.title}</div></div>`).join('');
      }
    } catch(e) {}
  }

  async function completeTask(taskId) {
    const btn = event.target;
    btn.style.background = 'var(--c-accent)';
    setTimeout(async () => {
        await gapi.client.tasks.tasks.patch({ tasklist: currentTaskListId, task: taskId, resource: { status: 'completed' } });
        loadData();
    }, 300);
  }

  document.addEventListener('DOMContentLoaded', () => {
    cal = new FullCalendar.Calendar(document.getElementById('calendar'), { 
      initialView: 'dayGridMonth', locale: 'ja', height: '100%', expandRows: true,
      headerToolbar: { left: 'title', center: '', right: '' }, 
      dayCellContent: (e) => e.dayNumberText.replace('日', ''),
      windowResizeDelay: 100
    });
    cal.render(); 
    tick(); setInterval(tick, 1000); initNews(); initWeather(); initRailway();
  });
</script>
</body>
</html>
